name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freelancer
          POSTGRES_USER: freelancer
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freelancer -d freelancer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_ENV: development
      SECRET_KEY: ci-only-not-a-secret-value-0123456789abcdef
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CORS_ALLOW_CREDENTIALS: "False"
      DATABASE_URL: postgresql://freelancer:ci-only-password@localhost:5432/freelancer
      RATE_LIMIT_CACHE_URL: redis://localhost:6379/0
      PRIVATE_MEDIA_ROOT: /tmp/freelancer-private-media
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: freelancer
          POSTGRES_USER: freelancer
          POSTGRES_PASSWORD: ci-only-password
          DJANGO_SECRET_KEY: ci-only-not-a-secret-value-0123456789abcdef
        run: docker compose config --quiet
      - name: Build Docker development images
        env:
          POSTGRES_DB: freelancer
          POSTGRES_USER: freelancer
          POSTGRES_PASSWORD: ci-only-password
          DJANGO_SECRET_KEY: ci-only-not-a-secret-value-0123456789abcdef
        run: docker compose build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Check migration state
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to CI PostgreSQL
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Run backend tests on PostgreSQL
        working-directory: backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend API paths
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
